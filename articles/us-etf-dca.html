        <h1>美股 ETF 定投 101：小白先买什么，怎么长期坚持？</h1>
        <p class="hero-text">这篇不是投资建议，而是一套学习框架：先理解指数和风险，再决定是否开始。</p>
      </section>
      <section class="article-body">
        <h2>先学三个词</h2>
        <p>指数、ETF、定投。指数是市场篮子，ETF 是可以买卖的基金工具，定投是用固定节奏降低择时压力的方法。</p>
        <h2>小白常见误区</h2>
        <p>不要用短期涨跌判断长期策略，不要把单只热门股当成全部投资，也不要在没有现金流计划时加杠杆。</p>
        <h2>行动清单</h2>
        <p>写下投资年限、每月可投入金额、最大可接受回撤，再去研究券商、税务和产品选择。</p>
